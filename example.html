<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#f4f3ed">
	<title>Sign in | Fieldnotes</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
	<style>
		:root {
			color-scheme: light;
			--ink: #20342f;
			--muted: #6d7974;
			--paper: #f4f3ed;
			--white: #fffefa;
			--line: #dce1d8;
			--green: #245c4b;
			--green-dark: #194638;
			--orange: #e58b62;
		}

		* { box-sizing: border-box; }

		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: 32px;
			background-color: var(--paper);
			background-image: radial-gradient(#c9d2c7 0.7px, transparent 0.7px);
			background-size: 15px 15px;
			color: var(--ink);
			font-family: "DM Sans", sans-serif;
		}

		.login {
			width: min(100%, 960px);
			min-height: 590px;
			display: grid;
			grid-template-columns: 1fr 1fr;
			overflow: hidden;
			background: var(--white);
			box-shadow: 0 24px 70px #263c3020;
		}

		.intro {
			position: relative;
			display: flex;
			flex-direction: column;
			justify-content: space-between;
			overflow: hidden;
			padding: 42px;
			background: var(--green);
			color: #f7f5eb;
		}

		.intro::before,
		.intro::after {
			position: absolute;
			content: "";
			pointer-events: none;
		}

		.intro::before {
			width: 380px;
			height: 380px;
			right: -115px;
			bottom: 86px;
			border: 1px solid #ffffff36;
			border-radius: 50%;
			box-shadow: 0 0 0 28px #ffffff0c, 0 0 0 58px #ffffff0a;
		}

		.intro::after {
			width: 190px;
			height: 190px;
			right: 40px;
			bottom: 150px;
			border: 1px solid #ffffff42;
			border-radius: 50%;
		}

		.brand {
			position: relative;
			z-index: 1;
			display: flex;
			align-items: center;
			gap: 11px;
			font-size: 15px;
			font-weight: 700;
			letter-spacing: 0.04em;
		}

		.brand-mark {
			width: 30px;
			height: 30px;
			display: grid;
			place-items: center;
			border: 1px solid #ffffff90;
			border-radius: 50%;
			color: var(--orange);
			font-family: "DM Serif Display", serif;
			font-size: 19px;
		}

		.intro-copy {
			position: relative;
			z-index: 1;
			max-width: 340px;
			margin: auto 0;
			padding: 68px 0;
		}

		.eyebrow {
			margin: 0 0 18px;
			color: #d4dfd4;
			font-size: 11px;
			font-weight: 700;
			letter-spacing: 0.14em;
			text-transform: uppercase;
		}

		h1 {
			margin: 0;
			font-family: "DM Serif Display", Georgia, serif;
			font-size: clamp(42px, 5vw, 58px);
			font-weight: 400;
			line-height: 1.04;
		}

		.intro-copy p:last-child {
			max-width: 285px;
			margin: 20px 0 0;
			color: #d6e0d8;
			font-size: 14px;
			line-height: 1.7;
		}

		.intro-footer {
			position: relative;
			z-index: 1;
			margin: 0;
			color: #d6e0d8;
			font-size: 12px;
		}

		.form-panel {
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 56px clamp(32px, 6vw, 72px);
		}

		.form-content { width: 100%; max-width: 340px; }

		.form-content h2 {
			margin: 0;
			font-family: "DM Serif Display", Georgia, serif;
			font-size: 36px;
			font-weight: 400;
			line-height: 1.15;
		}

		.form-lead {
			margin: 10px 0 32px;
			color: var(--muted);
			font-size: 14px;
		}

		.field { margin-bottom: 20px; }

		label {
			display: block;
			margin-bottom: 8px;
			font-size: 13px;
			font-weight: 600;
		}

		input[type="email"],
		input[type="password"] {
			width: 100%;
			height: 48px;
			padding: 0 14px;
			border: 1px solid var(--line);
			border-radius: 3px;
			outline: none;
			background: #fff;
			color: var(--ink);
			font: inherit;
			font-size: 14px;
			transition: border-color 150ms ease, box-shadow 150ms ease;
		}

		input[type="email"]::placeholder,
		input[type="password"]::placeholder { color: #9aa39d; }

		input[type="email"]:focus,
		input[type="password"]:focus {
			border-color: var(--green);
			box-shadow: 0 0 0 3px #245c4b1b;
		}

		.options {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 12px;
			margin: 2px 0 25px;
			font-size: 12px;
		}

		.remember {
			display: inline-flex;
			align-items: center;
			gap: 8px;
			color: var(--muted);
			cursor: pointer;
		}

		.remember input { accent-color: var(--green); }

		.help-link {
			color: var(--green);
			font-weight: 600;
			text-decoration: none;
		}

		.help-link:hover { text-decoration: underline; }

		.submit-button {
			width: 100%;
			min-height: 49px;
			border: 0;
			border-radius: 3px;
			background: var(--green);
			color: white;
			cursor: pointer;
			font: inherit;
			font-size: 14px;
			font-weight: 600;
			transition: background-color 150ms ease, transform 150ms ease;
		}

		.submit-button:hover { background: var(--green-dark); }
		.submit-button:active { transform: translateY(1px); }

		.message {
			min-height: 20px;
			margin: 13px 0 0;
			color: #9b4f35;
			font-size: 12px;
			line-height: 1.5;
		}

		.signup {
			margin: 23px 0 0;
			color: var(--muted);
			font-size: 13px;
			text-align: center;
		}

		@media (max-width: 700px) {
			body { padding: 18px; }
			.login { max-width: 440px; min-height: 0; grid-template-columns: 1fr; }
			.intro { min-height: 220px; padding: 25px 28px; }
			.intro::before { right: -180px; bottom: -240px; }
			.intro::after { right: 30px; bottom: -110px; }
			.intro-copy { padding: 28px 0 20px; }
			.eyebrow { margin-bottom: 9px; }
			h1 { max-width: 300px; font-size: 39px; }
			.intro-copy p:last-child, .intro-footer { display: none; }
			.form-panel { padding: 36px 28px 32px; }
			.form-content h2 { font-size: 32px; }
			.form-lead { margin-bottom: 25px; }
		}

		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after { transition-duration: 0.01ms !important; }
		}
	</style>
</head>
<body>
	<main class="login">
		<section class="intro" aria-label="Welcome">
			<div class="brand"><span class="brand-mark" aria-hidden="true">f</span> FIELDNOTES</div>
			<div class="intro-copy">
				<p class="eyebrow">A little room to think</p>
				<h1>Make space for what matters.</h1>
				<p>Your notes, ideas, and next steps, all in one quiet place.</p>
			</div>
			<p class="intro-footer">A thoughtful place for your everyday work.</p>
		</section>

		<section class="form-panel" aria-labelledby="form-title">
			<div class="form-content">
				<h2 id="form-title">Welcome back</h2>
				<p class="form-lead">Sign in to your account to continue.</p>
				<form id="login-form">
					<div class="field">
						<label for="email">Email address</label>
						<input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
					</div>
					<div class="field">
						<label for="password">Password</label>
						<input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
					</div>
					<div class="options">
						<label class="remember"><input type="checkbox" name="remember"> Remember me</label>
						<a class="help-link" href="mailto:support@example.com?subject=Password%20help">Forgot password?</a>
					</div>
					<button class="submit-button" type="submit">Sign in</button>
					<p class="message" id="form-message" role="status" aria-live="polite"></p>
				</form>
				<p class="signup">New here? <a class="help-link" href="mailto:support@example.com?subject=Create%20an%20account">Create an account</a></p>
			</div>
		</section>
	</main>
	<script>
		document.getElementById("login-form").addEventListener("submit", (event) => {
			event.preventDefault();
			document.getElementById("form-message").textContent = "Sign-in isn't connected yet. Please try again later.";
		});
	</script>
</body>
</html>
